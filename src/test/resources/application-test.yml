spring:
  datasource:
    url: jdbc:h2:mem:activation-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:

app:
  provider:
    connect-timeout: 500ms
    read-timeout: 500ms
  processing:
    scheduler-enabled: false
    max-attempts: 3
    initial-backoff: 0ms
    max-backoff: 1m
    processing-lease: 200ms
