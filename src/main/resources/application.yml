spring:
  application:
    name: activation-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/activation}
    username: ${DB_USERNAME:activation}
    password: ${DB_PASSWORD:activation}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8089/auth/jwks.json}
          issuer-uri: ${JWT_ISSUER:https://auth.dev.local}
          audiences: ${JWT_AUDIENCE:activation-service}
  lifecycle:
    timeout-per-shutdown-phase: 20s
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 20s

server:
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        provider.activation: true

app:
  provider:
    base-url: ${PROVIDER_BASE_URL:http://localhost:8089}
    connect-timeout: ${PROVIDER_CONNECT_TIMEOUT:2s}
    read-timeout: ${PROVIDER_READ_TIMEOUT:5s}
    api-key: ${PROVIDER_API_KEY:}
  processing:
    scheduler-enabled: ${PROCESSING_SCHEDULER_ENABLED:true}
    poll-interval: PT1S
    batch-size: 50
    max-attempts: 5
    initial-backoff: 2s
    max-backoff: 5m
    processing-lease: 2m

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
